name: Release applications
run-name: Release applications (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy applications
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      RESOURCE_GROUP_OVERRIDE: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
      FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
      STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release settings
        run: |
          set -euo pipefail
          for name in API_APP_NAME FUNCTION_APP_NAME STATIC_WEB_APP_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing environment setting: $name"
              exit 1
            fi
          done
          parameter_file="infra/parameters.${DEPLOYMENT_ENVIRONMENT}.json"
          jq -e --arg environment "$DEPLOYMENT_ENVIRONMENT"             '.parameters.environmentName.value == $environment and (.parameters.deployAppHosting.value != false)' "$parameter_file" > /dev/null
          workload=$(jq -r '.parameters.workloadName.value | ascii_downcase' "$parameter_file")
          printf 'RESOURCE_GROUP_NAME=%s\n' "${RESOURCE_GROUP_OVERRIDE:-${workload}-${DEPLOYMENT_ENVIRONMENT}}" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployed resources
        run: |
          set -euo pipefail
          api_host=$(az webapp show --resource-group "$RESOURCE_GROUP_NAME" --name "$API_APP_NAME" --query defaultHostName --output tsv)
          az functionapp show --resource-group "$RESOURCE_GROUP_NAME" --name "$FUNCTION_APP_NAME" --output none
          web_host=$(az staticwebapp show --resource-group "$RESOURCE_GROUP_NAME" --name "$STATIC_WEB_APP_NAME" --query defaultHostname --output tsv)
          if [[ -z "$api_host" || -z "$web_host" ]]; then
            echo "::error::Application host names could not be resolved."
            exit 1
          fi
          printf 'API_URL=https://%s\nWEB_URL=https://%s\n' "$api_host" "$web_host" >> "$GITHUB_ENV"

      - name: Publish backend applications
        run: |
          set -euo pipefail
          dotnet publish backend/ChatApp.Api/ChatApp.Api.csproj --configuration Release --output "$RUNNER_TEMP/release/api"
          dotnet publish backend/ChatApp.AzureFunctions/ChatApp.AzureFunctions.csproj --configuration Release --output "$RUNNER_TEMP/release/functions"
          (cd "$RUNNER_TEMP/release/api" && zip -qr "$RUNNER_TEMP/release/api.zip" .)
          (cd "$RUNNER_TEMP/release/functions" && zip -qr "$RUNNER_TEMP/release/functions.zip" .)

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ vars.VITE_GOOGLE_REDIRECT_URI }}
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ vars.VITE_MICROSOFT_TENANT_ID }}
          VITE_MICROSOFT_REDIRECT_URI: ${{ vars.VITE_MICROSOFT_REDIRECT_URI }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Retrieve Static Web App deployment token
        id: static_web_app
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list --resource-group "$RESOURCE_GROUP_NAME" --name "$STATIC_WEB_APP_NAME" --query properties.apiKey --output tsv)
          if [[ -z "$token" ]]; then
            echo "::error::Static Web App deployment token is empty."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Deploy API
        run: |
          set -euo pipefail
          az webapp deploy --resource-group "$RESOURCE_GROUP_NAME" --name "$API_APP_NAME"             --src-path "$RUNNER_TEMP/release/api.zip" --type zip --output none
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors             --connect-timeout 10 --max-time 30 "$API_URL/health"

      - name: Deploy Azure Functions
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip --resource-group "$RESOURCE_GROUP_NAME"             --name "$FUNCTION_APP_NAME" --src "$RUNNER_TEMP/release/functions.zip" --build-remote false --output none

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static_web_app.outputs.token }}
          action: upload
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}

      - name: Release summary
        run: |
          {
            printf '### Applications released\n\nEnvironment: `%s`\n\nCommit: `%s`\n\n' "$DEPLOYMENT_ENVIRONMENT" "$GITHUB_SHA"
            printf -- '- API: %s\n- Frontend: %s\n- Function App: `%s`\n' "$API_URL" "$WEB_URL" "$FUNCTION_APP_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
